services:
  qwen36-blackwell-nvfp4-vision:
    image: vllm/vllm-openai:cu130-nightly
    container_name: qwen36-blackwell-nvfp4-vision
    runtime: nvidia
    ipc: host
    platform: linux/amd64
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    volumes:
      - /opt/hf-cache:/root/.cache/huggingface
      - ./logs:/var/log/vllm
    ulimits:
      memlock: -1
      stack: 67108864
    ports:
      - "8000:8000"
    environment:
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - HF_HUB_ENABLE_HF_TRANSFER=1
      - HF_TOKEN=your_hf_token_here_if_you_have_one
      - OMP_NUM_THREADS=16
      - MKL_NUM_THREADS=16
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    command: >
      AEON-7/Qwen3.6-27B-AEON-Ultimate-Uncensored-Multimodal-NVFP4-MTP
      --served-model-name 96gbBigModel
      --limit-mm-per-prompt '{"image":4,"video":2}'
      --quantization modelopt_fp4
      --tensor-parallel-size 1
      --max-model-len 262144
      --max-num-seqs 64
      --max-num-batched-tokens 16384
      --block-size 32
      --gpu-memory-utilization 0.93
      --enable-prefix-caching
      --enable-chunked-prefill
      --enable-auto-tool-choice
      --tool-call-parser qwen3_coder
      --reasoning-parser qwen3
      --attention-backend FLASHINFER
      --speculative-config '{"method":"mtp","num_speculative_tokens":3}'
      --default-chat-template-kwargs '{"preserve_thinking":false,"enable_thinking":false}'
      --compilation-config '{"cudagraph_mode":"PIECEWISE"}'
      --no-use-tqdm-on-load
      --host 0.0.0.0
      --port 8000
    restart: unless-stopped
